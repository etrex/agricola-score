AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Globals:
  Function:
    Timeout: 30
    MemorySize: 2048
    Runtime: ruby3.3
    Architectures:
      - x86_64
    Environment:
      Variables:
        DYNAMODB_TABLE: agricola-score
        LINE_CHANNEL_SECRET_NAME: /agricola-score/line-channel-secret
        LINE_CHANNEL_ACCESS_TOKEN_NAME: /agricola-score/line-channel-access-token

Resources:
  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: agricola-score-webhook-handler
      CodeUri: lambda/
      Handler: app.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: agricola-score
        - SSMParameterReadPolicy:
            ParameterName: agricola-score/*
      LoggingConfig:
        LogGroup: !Ref WebhookFunctionLogGroup
      FunctionUrlConfig:
        AuthType: NONE

  WebhookFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${WebhookFunction}
      RetentionInDays: 14

  AgricolaScoreTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: agricola-score
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: sessionId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: N
        - AttributeName: type
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: sessionId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: UserScoreIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: SavedScoreIndex
          KeySchema:
            - AttributeName: type
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain

Outputs:
  WebhookFunctionUrl:
    Description: Lambda Function URL for LINE Webhook
    Value: !GetAtt WebhookFunctionUrl.FunctionUrl
